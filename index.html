<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punit Sir - WhatsApp</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 50%;
      background: #25D366;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: 26px;
    }

    .verified {
      color: #25D366;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .message {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .whatsapp {
      display: block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .small {
      margin-top: 15px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">P</div>

    <h1>Punit Sir</h1>

    <div class="verified">✓ WhatsApp Contact</div>

    <div class="message">
      <b>Punit Sir:</b><br><br>
      Hello, aapka message mil gaya hai.
      WhatsApp par direct contact karne ke liye neeche diye gaye button par click karein.
    </div>

    <a class="whatsapp"
       href="https://wa.me/916356402379"
       target="_blank">
       💬 Reply on WhatsApp
    </a>

    <div class="small">
      Direct WhatsApp contact
    </div>

  </div>

</body>
</html>
